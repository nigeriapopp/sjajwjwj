name: Build Vapor APK

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;34.0.0" > /dev/null

      # The same signing key on every build lets a new APK install as an update over the old one.
      # Source, in order: repo secret VAPOR_SIGNING_KEY_B64 (base64 debug.keystore, passwords "android"),
      # else this repo's private Actions cache, else a new key that is then saved to the cache.
      - name: Restore signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/.vapor-key
          key: vapor-signing-key-v1

      - name: Signing key
        id: key
        env:
          KEY_B64: ${{ secrets.VAPOR_SIGNING_KEY_B64 }}
        run: |
          mkdir -p ~/.android ~/.vapor-key
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using signing key from repo secret"
          elif [ -f ~/.vapor-key/debug.keystore ]; then
            cp ~/.vapor-key/debug.keystore ~/.android/debug.keystore
            echo "Using saved signing key"
          else
            keytool -genkeypair -keystore ~/.vapor-key/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Vapor,O=Vapor,C=US"
            cp ~/.vapor-key/debug.keystore ~/.android/debug.keystore
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "Created a new signing key"
          fi

      - name: Save signing key
        if: steps.key.outputs.generated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.vapor-key
          key: vapor-signing-key-v1

      # No analytics keys: the secrets plugin copies values verbatim into BuildConfig,
      # and without them the app's own fallback ("" key) keeps analytics off.
      - name: Local properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build app bundle
        run: ./gradlew :app:bundleLegacyRelease -PvaporBuild=${{ github.run_number }}

      - name: Make universal APK (includes the Ubuntu runtime module)
        id: apk
        run: |
          ./gradlew --stop || true
          java -Xmx3g -jar tools/bundletool-all-1.17.2.jar build-apks \
            --bundle=app/build/outputs/bundle/legacyRelease/app-legacy-release.aab \
            --output=vapor.apks --mode=universal
          unzip -o vapor.apks universal.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out universal-signed.apk universal.apk
          mkdir -p out
          VERSION="1.5.0-vapor.${{ github.run_number }}"
          mv universal-signed.apk "out/Vapor-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Vapor-apk
          path: out/*.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'claude/steam-games-android-3vdaxx' || github.ref_name == 'main' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vapor-build${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --target "${{ github.sha }}" \
            --title "Vapor ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Download the APK below on your phone and install it. First-time setup guide: see README." \
            --latest
